<!DOCTYPE html>
<html 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
	layout:decorate="~{layout/layout.html}" >
<head>
<meta charset="UTF-8">
<title>퀴즈Q : 커뮤니티</title>
<link rel="stylesheet" href="/css/postList.css">
</head>
<body>
	<main layout:fragment="content" >
	    <div class="post-container">
	        <div class="post-header">
	            <h1 class="post-title">커뮤니티</h1>
	        </div>
	        <div>
				<nav class="post-nav">
					<a href="#">인기글</a>
					<a href="#">최신글</a>
					<a href="/commnunity/insert">게시글 등록</a>
					<a href="/community/list">커뮤니티 목록</a>
	            </nav>
	            <table class="post-table">
                	<thead>
                    	<tr>
                        	<th>번호</th>
	                        <th>작성자</th>
	                        <th>제목</th>
	                        <th>날짜</th>
	                        <th>조회수</th>
	                    </tr>
	                </thead>
	                <tbody>
						<tr th:each="list : ${list}">
							<td th:text="${list.po_num}"></td>
							<td th:text="${list.mb_id}"></td>
							<td th:text="${list.po_title}"></td>
							<td th:text="${list.po_date}"></td>
							<td th:text="${list.po_view}"></td>
						</tr>
						<tr class="text-center" th:if="${list == null or #lists.isEmpty(list)}">
							<td colspan="5"><b>등록된 게시글이 없습니다.</b></td>
						</tr>
	                </tbody>
	            </table>
	        </div>
	        <div class="post-footer">
	            <p>&copy; 퀴즈Q 커뮤니티. All rights reserved.</p>
	        </div>
	    </div>
	    <ul class="pagination justify-content-center" th:object="${pm}" th:if="${pm.endPage != 0}">
   			<li class="page-item" th:if="*{prev}">
   				<a class="page-link" th:href="@{/community/post/list/{co_num}(page=*{startPage - 1}, co_num=*{cri.co_num})}">이전</a>
   			</li>
		    <li class="page-item" 
		    	th:each="i : *{#numbers.sequence(startPage, endPage)}"
		    	th:classappend="*{cri.page} == ${i} ? 'active' : ''">
		   	 	<a class="page-link" th:href="@{/community/post/list/{co_num}(page=${i}, co_num=*{cri.co_num})}" th:text="${i}"></a>
		    </li>
		    <li class="page-item" th:if="*{next}">
		   		<a class="page-link" th:href="@{/community/post/list/{co_num}(page=*{endPage + 1}, co_num=*{cri.co_num})}">다음</a>
		    </li>
  		</ul>
	</main>
</body>
</html>
